name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            ai_module/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt PySide6

      - name: Run tests
        run: python -m unittest discover -s tests -v
